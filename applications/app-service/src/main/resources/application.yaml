server:
  port: 8081
spring:
  web:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: "crediya-solicitudes-ms"
  devtools:
    add-properties: false
  profiles:
    include: null
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/crediya_solicitudes}"
    username: "${DB_USER:crediya}"
    password: "${DB_PASSWORD:crediya123}"
    driverClassName: "org.postgresql.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.PostgreSQLDialect"
    hibernate:
      ddl-auto: update
    show-sql: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"


